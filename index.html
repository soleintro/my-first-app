<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dashboard</title>

  <style>
    /* ============================================================
       PART 1: STYLE (CSS)
       This part controls how everything LOOKS: colours, sizes, spacing.
       ============================================================ */

    /* Colours are stored as named "variables" so we can change them in one place. */
    :root {
      --background: #eaf0f3;   /* page background: soft grey-blue */
      --card: #ffffff;         /* white panels */
      --ink: #1c2b39;          /* main text: deep navy */
      --muted: #5b6b78;        /* lighter text */
      --line: #d3dde4;         /* thin borders */
      --accent: #0f766e;       /* main buttons: deep teal */
      --accent-text: #ffffff;  /* text on main buttons */
      --danger: #b42318;       /* delete buttons: red */
      --done: #e3f2ee;         /* background of finished tasks */
    }

    /* If your phone or computer is in dark mode, use darker colours. */
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #121b22;
        --card: #1b2731;
        --ink: #e8eef2;
        --muted: #9fb0bd;
        --line: #31424f;
        --accent: #2ab3a6;
        --accent-text: #08201d;
        --danger: #ff8a7d;
        --done: #17342f;
      }
    }

    /* Make sizes include padding, which makes layout easier to predict. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 18px;
      line-height: 1.5;
    }

    /* The main column. It is centred and never gets too wide to read. */
    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header { margin-bottom: 24px; }
    header h1 { margin: 0; font-size: 2rem; line-height: 1.2; }
    header p  { margin: 4px 0 0; color: var(--muted); }

    /* Layout: one column on phones, two side-by-side columns on wide screens. */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (min-width: 800px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    /* Each section (Tasks, Notes) sits in a white panel. */
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }
    section h2 { margin: 0 0 4px; font-size: 1.4rem; }
    .hint { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }

    /* ---------- Buttons: big and easy to tap ---------- */
    button {
      font: inherit;
      font-weight: 600;
      min-height: 52px;             /* tall enough for a thumb */
      padding: 10px 18px;
      border-radius: 12px;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: var(--accent-text); }
    button.danger  { border-color: var(--danger); color: var(--danger); }
    button:hover   { filter: brightness(0.93); }

    /* A clear outline when you use the keyboard (Tab key). */
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- Text boxes ---------- */
    input[type="text"], textarea {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: var(--background);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }
    textarea { min-height: 140px; resize: vertical; }

    /* The row with the task text box and the Add button */
    .add-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    @media (min-width: 500px) {
      .add-row { flex-direction: row; }
      .add-row input { flex: 1; }
    }

    /* ---------- Task list ---------- */
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .task {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .task.finished { background: var(--done); }
    .task.finished .task-text { text-decoration: line-through; color: var(--muted); }
    .task-text { word-break: break-word; }
    .task-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .task-buttons button { flex: 1; min-width: 130px; }

    /* ---------- Notes ---------- */
    .note {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }
    .photos { display: grid; gap: 12px; }
    .photo { margin: 0; display: grid; gap: 8px; }
    .photo img { width: 100%; height: auto; border-radius: 10px; display: block; }
    .note-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .note-buttons button { flex: 1; min-width: 130px; }

    /* Message line (for "Saved" or error messages) */
    #message { min-height: 1.5em; margin: 16px 0 0; color: var(--muted); font-size: 0.95rem; }
    #message.error { color: var(--danger); font-weight: 600; }

    /* Shown when a list is empty */
    .empty { color: var(--muted); padding: 8px 0; }

    /* A hidden file picker: we open it using our own big button instead. */
    .hidden { display: none; }
  </style>
</head>

<body>
  <!-- ============================================================
       PART 2: STRUCTURE (HTML)
       This part is the skeleton: the headings, boxes and buttons.
       JavaScript (Part 3) fills in the tasks and notes.
       ============================================================ -->
  <div class="page">

    <header>
      <h1>My Dashboard</h1>
      <p id="today"></p>
    </header>

    <main class="grid">

      <!-- TASKS -->
      <section aria-labelledby="tasks-title">
        <h2 id="tasks-title">Tasks</h2>
        <p class="hint" id="task-count"></p>

        <div class="add-row">
          <input type="text" id="task-input" placeholder="Type a new task" aria-label="New task">
          <button class="primary" id="add-task">Add task</button>
        </div>

        <ul id="task-list"></ul>
      </section>

      <!-- NOTES -->
      <section aria-labelledby="notes-title">
        <h2 id="notes-title">Notes</h2>
        <p class="hint">Your changes save automatically.</p>
        <button class="primary" id="add-note">Add new note</button>
        <div id="note-list"></div>
      </section>

    </main>

    <p id="message" role="status" aria-live="polite"></p>
  </div>

  <script>
    /* ============================================================
       PART 3: BEHAVIOUR (JavaScript)
       This part makes the page DO things.
       ============================================================ */

    // ---------- 1. Our data ----------
    // "data" holds everything we want to remember: a list of tasks and a list of notes.
    let data = { tasks: [], notes: [] };

    // The name under which we store things in the browser's memory.
    const STORAGE_KEY = "my-dashboard-data";

    // ---------- 2. Saving and loading ----------
    // localStorage is a small storage area built into every browser.
    // It keeps your data after you close the page, on the same device and browser.

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          data.tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
          data.notes = Array.isArray(parsed.notes) ? parsed.notes : [];
        }
      } catch (error) {
        showMessage("Your saved data could not be read.", true);
      }
    }

    function saveData() {
      try {
        // JSON.stringify turns our data into text so it can be stored.
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        showMessage("Saved.", false);
        return true;
      } catch (error) {
        // This usually means the browser storage is full (too many photos).
        showMessage("Could not save. Storage may be full. Try deleting a photo.", true);
        return false;
      }
    }

    // Shows a short message at the bottom of the page.
    function showMessage(text, isError) {
      const box = document.getElementById("message");
      box.textContent = text;
      box.className = isError ? "error" : "";
    }

    // Makes a unique ID for each task and note, so we can tell them apart.
    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ---------- 3. Today's date ----------
    function showDate() {
      const options = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
      document.getElementById("today").textContent =
        new Date().toLocaleDateString(undefined, options);
    }

    // ---------- 4. Tasks ----------
    const taskInput = document.getElementById("task-input");
    const taskList  = document.getElementById("task-list");

    function addTask() {
      const text = taskInput.value.trim();     // trim() removes extra spaces
      if (text === "") {
        showMessage("Please type a task first.", true);
        taskInput.focus();
        return;
      }
      data.tasks.push({ id: newId(), text: text, done: false });
      taskInput.value = "";
      saveData();
      renderTasks();
      taskInput.focus();
    }

    function toggleTask(id) {
      const task = data.tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;     // flip between true and false
        saveData();
        renderTasks();
      }
    }

    function deleteTask(id) {
      data.tasks = data.tasks.filter(t => t.id !== id);   // keep everything except this one
      saveData();
      renderTasks();
    }

    // Draws the task list on the screen from our data.
    function renderTasks() {
      taskList.innerHTML = "";

      const remaining = data.tasks.filter(t => !t.done).length;
      document.getElementById("task-count").textContent =
        data.tasks.length === 0
          ? "Nothing to do yet."
          : remaining + " to do, " + (data.tasks.length - remaining) + " done";

      if (data.tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "Add your first task above.";
        taskList.appendChild(empty);
        return;
      }

      data.tasks.forEach(task => {
        const item = document.createElement("li");
        item.className = "task" + (task.done ? " finished" : "");

        const text = document.createElement("div");
        text.className = "task-text";
        text.textContent = task.text;   // textContent is safe: it never runs typed code

        const buttons = document.createElement("div");
        buttons.className = "task-buttons";

        const doneButton = document.createElement("button");
        doneButton.textContent = task.done ? "Mark as not done" : "Mark as done";
        doneButton.addEventListener("click", () => toggleTask(task.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.textContent = "Delete task";
        deleteButton.addEventListener("click", () => deleteTask(task.id));

        buttons.append(doneButton, deleteButton);
        item.append(text, buttons);
        taskList.appendChild(item);
      });
    }

    document.getElementById("add-task").addEventListener("click", addTask);
    // Also let the Enter key add the task.
    taskInput.addEventListener("keydown", event => {
      if (event.key === "Enter") addTask();
    });

    // ---------- 5. Notes ----------
    const noteList = document.getElementById("note-list");

    function addNote() {
      // New notes go to the top of the list.
      data.notes.unshift({ id: newId(), text: "", photos: [] });
      saveData();
      renderNotes();
      // Put the cursor in the new note so you can start typing.
      const firstBox = noteList.querySelector("textarea");
      if (firstBox) firstBox.focus();
    }

    function deleteNote(id) {
      if (!confirm("Delete this note and its photos?")) return;
      data.notes = data.notes.filter(n => n.id !== id);
      saveData();
      renderNotes();
    }

    // Shrinks a photo so it takes less storage space.
    // Phone photos are huge; browser storage is small (about 5 MB).
    function shrinkPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("read failed"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("image failed"));
          img.onload = () => {
            const maxSize = 800;   // longest side, in pixels
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width  = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.7));   // 0.7 = good quality, small size
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function addPhotos(note, files) {
      for (const file of files) {
        if (!file.type.startsWith("image/")) continue;
        try {
          const photo = await shrinkPhoto(file);
          note.photos.push(photo);
        } catch (error) {
          showMessage("One photo could not be added.", true);
        }
      }
      if (saveData()) {
        renderNotes();
      } else {
        // Saving failed, so undo the photos we just added.
        note.photos.length = Math.max(0, note.photos.length - files.length);
        renderNotes();
        showMessage("Could not save. Storage may be full. Try deleting a photo.", true);
      }
    }

    // Draws all notes on the screen.
    function renderNotes() {
      noteList.innerHTML = "";

      if (data.notes.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No notes yet. Tap “Add new note” to start.";
        noteList.appendChild(empty);
        return;
      }

      data.notes.forEach(note => {
        const card = document.createElement("div");
        card.className = "note";

        // The writing area. Every time you type, we save.
        const box = document.createElement("textarea");
        box.value = note.text;
        box.placeholder = "Write your note here";
        box.setAttribute("aria-label", "Note text");
        box.addEventListener("input", () => {
          note.text = box.value;
          saveData();
        });

        // The photos inside this note
        const photos = document.createElement("div");
        photos.className = "photos";
        note.photos.forEach((src, index) => {
          const figure = document.createElement("figure");
          figure.className = "photo";

          const img = document.createElement("img");
          img.src = src;
          img.alt = "Photo in your note";

          const removeButton = document.createElement("button");
          removeButton.className = "danger";
          removeButton.textContent = "Remove photo";
          removeButton.addEventListener("click", () => {
            note.photos.splice(index, 1);   // remove this one photo from the list
            saveData();
            renderNotes();
          });

          figure.append(img, removeButton);
          photos.appendChild(figure);
        });

        // A hidden file picker, opened by our big "Add photo" button.
        const picker = document.createElement("input");
        picker.type = "file";
        picker.accept = "image/*";
        picker.multiple = true;
        picker.className = "hidden";
        picker.addEventListener("change", () => {
          if (picker.files.length > 0) addPhotos(note, Array.from(picker.files));
        });

        const buttons = document.createElement("div");
        buttons.className = "note-buttons";

        const photoButton = document.createElement("button");
        photoButton.textContent = "Add photo";
        photoButton.addEventListener("click", () => picker.click());

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.textContent = "Delete note";
        deleteButton.addEventListener("click", () => deleteNote(note.id));

        buttons.append(photoButton, deleteButton);
        card.append(box, photos, picker, buttons);
        noteList.appendChild(card);
      });
    }

    document.getElementById("add-note").addEventListener("click", addNote);

    // ---------- 6. Start the app ----------
    // When the page opens: load saved data, then draw everything.
    loadData();
    showDate();
    renderTasks();
    renderNotes();
  </script>
</body>
</html>
